name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # ogni giorno alle 06:00 UTC: riscarica i prezzi MIMIT e ripubblica
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Il sito del MIMIT spesso non risponde ai server di GitHub: in quel caso
      # si usano i dati già presenti nel repo (public/data).
      - name: Scarica i prezzi MIMIT
        run: npm run data
        continue-on-error: true
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
