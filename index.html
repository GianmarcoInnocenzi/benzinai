<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Benzinai</title>
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Benzinai" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
  </head>
  <body>
    <div id="map"></div>

    <header id="bar">
      <button id="open-filters" type="button" aria-expanded="false" aria-controls="filters-panel">
        Filtri <span id="filter-count" hidden>0</span>
      </button>
      <button id="open-best" type="button" aria-expanded="false" aria-controls="best-panel" hidden>
        ★ Migliori
      </button>
      <button id="search" type="button" hidden>Cerca qui</button>
    </header>

    <section id="filters-panel" hidden aria-label="Filtri">
      <h2>Carburante</h2>
      <div id="fuels" class="seg" role="group" aria-label="Carburante"></div>

      <h2>Marchio</h2>
      <div id="brands" class="chips" role="group" aria-label="Marchi"></div>
      <input
        id="brand-search"
        type="search"
        list="brand-list"
        placeholder="Cerca un altro marchio…"
        autocomplete="off"
        autocapitalize="off"
        aria-label="Cerca un marchio"
      />
      <datalist id="brand-list"></datalist>

      <div class="actions">
        <button id="reset-filters" type="button">Azzera filtri</button>
        <button id="close-filters" type="button" class="primary">Mostra risultati</button>
      </div>
    </section>

    <section id="best-panel" hidden aria-label="Migliori prezzi della zona">
      <h2>Migliori prezzi sulla mappa</h2>
      <div id="best-fuels" class="seg" role="group" aria-label="Carburante"></div>
      <ol id="best-list"></ol>
      <p id="best-empty" class="hint" hidden></p>
    </section>

    <button id="toast" type="button" hidden></button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
